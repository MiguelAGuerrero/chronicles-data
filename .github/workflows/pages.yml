name: Publish archives to Pages

on:
  release:
    types: [published, deleted]
  # A change to how the site is built republishes it (the manifest's script, this workflow).
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', 'scripts/**', 'contract/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # How many of the newest releases stay online (older app sessions may still hold their manifest).
  KEEP: 3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the newest releases' archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select((.isDraft or .isPrerelease) | not)] | sort_by(.publishedAt) | reverse | .[].tagName' > all.txt
          # ST10: a release may carry only the places pack or only the stores pack, so the newest KEEP releases are
          # chosen for each kind apart; a stores-only week must not push the places pack off the site, nor the reverse.
          : > tags.txt
          for kind in places stores; do
            n=0
            while read -r tag; do
              [ "$n" -ge "$KEEP" ] && break
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q "^$kind-.*\.pmtiles$"; then
                echo "$tag" >> tags.txt
                n=$((n + 1))
              fi
            done < all.txt
          done
          sort -u tags.txt -o tags.txt
          while read -r tag; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'places-*.pmtiles' --pattern 'places-*.blocks.json' --pattern 'places-*.license' \
              --pattern 'stores-*.pmtiles' --pattern 'stores-*.blocks.json' --pattern 'stores-*.license' --dir site --skip-existing
          done < tags.txt
      - name: Write the manifest, and serve the contract beside it
        run: |
          node scripts/manifest.mjs site > site/manifest.json && touch site/.nojekyll
          mkdir -p site/contract && cp contract/*.json site/contract/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
