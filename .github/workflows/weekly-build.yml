name: Weekly places build

# The places pipeline (docs/spec.md; decisions 0103, 0108 and 0120 in the app repo): once a week, fetch every source
# through its adapter (Wikidata changes first, CF1-CF5), build the US archive and publish a release only when a block's places changed (PP12).
# A push to main rebuilds too, fetching only the sources whose fetch changed (RB1-RB5). Its
# state (raw answers and the place ID registry) is kept between runs as the `state-us` pre-release, which the Pages
# workflow never serves (PP15).

on:
  schedule:
    - cron: '17 7 * * 1' # Mondays, 07:17 UTC
  # CF4: a sweep by hand of one box (w,s,e,n); empty runs the weekly fetch now.
  workflow_dispatch:
    inputs:
      box:
        description: 'Sweep only this box, w,s,e,n (empty: the weekly changes-first fetch)'
        required: false
        default: ''
      # RB9: fetch only these sources (e.g. wikidata); the rest are built from their kept answers. Empty: every source.
      sources:
        description: 'Fetch only these sources, comma-separated (e.g. wikidata). Empty: every source, OpenStreetMap included (over an hour)'
        required: false
        default: ''
  # RB1: a push that changes the code, the owner's files or the dependencies rebuilds by itself, fetching only the
  # sources whose fetch changed (RB3); the edits alone fetch nothing.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - edits.json
      - review-areas.json
      - package.json
      - package-lock.json

permissions:
  contents: write # create the release
  actions: write # start the Pages workflow (a release made with this token starts no workflow by itself)

concurrency:
  group: places-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # RB1: a commit that fails its typecheck or tests builds nothing.
      - name: Typecheck and test
        run: npm run typecheck && npm test
      - name: Restore the pipeline's state (raw answers and the place ID registry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          if gh release download state-us --repo "$GITHUB_REPOSITORY" --pattern 'state-us.tar.gz'; then tar -xzf state-us.tar.gz -C state; fi
      # RB4: a push fetches only the sources whose fetch changed; the plan names them.
      - name: Plan what a push fetches
        id: plan
        if: github.event_name == 'push'
        run: npm run -s build -- --region us --version "$(date -u +%Y%m%d).${{ github.run_number }}" --state state --plan >> "$GITHUB_OUTPUT"
      # RD7: the OpenStreetMap adapter filters Geofabrik's extracts with osmium; a push installs it only to fetch OSM.
      - name: Install osmium
        if: (github.event_name == 'push' && contains(format(' {0} ', steps.plan.outputs.stale), ' osm ')) || (github.event_name != 'push' && (inputs.sources == '' || contains(inputs.sources, 'osm')))
        timeout-minutes: 10 # a stalled apt mirror once held a run for the whole 300 minutes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Run the pipeline (fetch, adapt, conflate, gate, package, decide)
        id: run
        env:
          BOX: ${{ inputs.box }}
          SOURCES: ${{ inputs.sources }}
        run: |
          # The run number keeps a second run on the same day from colliding with the first's tag.
          version="$(date -u +%Y%m%d).${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # RB3: a push fetches only the stale sources and builds the rest from kept answers; CF4: a box sweeps only its cells.
          extra=""
          if [ "${{ github.event_name == 'push' }}" = "true" ]; then extra="--fetch-stale"; fi
          if [ -n "$BOX" ]; then extra="$extra --box $BOX"; fi
          # RB9: a hand run that names its sources fetches only those.
          if [ -n "$SOURCES" ]; then extra="$extra --sources $SOURCES"; fi
          npm run -s build -- --region us --version "$version" --state state --out out --edits edits.json --review-areas review-areas.json $extra \
            --manifest-url https://miguelaguerrero.github.io/chronicles-data/manifest.json >> "$GITHUB_OUTPUT"
      # RD12: the owner's review stays a workflow artifact, never a release asset.
      - name: Keep the owner's review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/report.json
          if-no-files-found: ignore
      - name: Save the state for next week (only sources whose terms allow it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths="registry-us.json"
          for s in ${{ steps.run.outputs.state-sources }}; do [ -d "state/raw/$s" ] && paths="$paths raw/$s"; done
          tar -czf state-us.tar.gz -C state $paths
          gh release view state-us --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create state-us --repo "$GITHUB_REPOSITORY" --prerelease --title "Pipeline state (us)" --notes "The places pipeline's raw answers and place ID registry, restored by each weekly run. Not an archive."
          gh release upload state-us state-us.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish a release, and republish the site
        if: steps.run.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.run.outputs.version }}"
          assets=""
          for f in ${{ steps.run.outputs.files }}; do assets="$assets out/$f out/${f%.pmtiles}.blocks.json out/${f%.pmtiles}.license"; done
          gh release create "v$v" $assets --repo "$GITHUB_REPOSITORY" --title "US places $v" --notes "Weekly build: ${{ steps.run.outputs.reason }}."
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Nothing changed
        if: steps.run.outputs.publish != 'true'
        run: |
          echo "Not published: ${{ steps.run.outputs.reason }}"
