name: Weekly places build

# Once a week, fetch every source through its adapter (Wikidata changes first, CF1-CF5) and build the US archive; a push
# to main rebuilds too, fetching only the sources whose fetch changed (RB1-RB5). The job itself is build.yml. A build by
# hand, choosing its sources, is manual-build.yml (MB1-MB4): this workflow is never run by hand.

on:
  schedule:
    - cron: '17 7 * * 1' # Mondays, 07:17 UTC
  # RB1: a push that changes the code, the owner's files or the dependencies rebuilds by itself, fetching only the
  # sources whose fetch changed (RB3); the edits alone fetch nothing.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - edits.json
      - review-areas.json
      - package.json
      - package-lock.json

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
