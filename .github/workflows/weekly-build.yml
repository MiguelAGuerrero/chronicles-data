name: Weekly places build

# The places pipeline (docs/spec.md; decisions 0103, 0108 and 0120 in the app repo): once a week, fetch every source
# through its adapter (Wikidata changes first, CF1-CF5), build the US archive and publish a release only when a block's places changed (PP12). Its
# state (raw answers and the place ID registry) is kept between runs as the `state-us` pre-release, which the Pages
# workflow never serves (PP15).

on:
  schedule:
    - cron: '17 7 * * 1' # Mondays, 07:17 UTC
  # CF4: a sweep by hand of one box (w,s,e,n); empty runs the weekly fetch now.
  workflow_dispatch:
    inputs:
      box:
        description: 'Sweep only this box, w,s,e,n (empty: the weekly changes-first fetch)'
        required: false
        default: ''
  # CF6: the owner's edits or the classes changed: rebuild from the kept answers, asking no source.
  push:
    branches: [main]
    paths:
      - edits.json
      - src/adapters/wikidata/classify.mjs
      - src/classes.ts

permissions:
  contents: write # create the release
  actions: write # start the Pages workflow (a release made with this token starts no workflow by itself)

concurrency:
  group: places-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the pipeline's state (raw answers and the place ID registry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          if gh release download state-us --repo "$GITHUB_REPOSITORY" --pattern 'state-us.tar.gz'; then tar -xzf state-us.tar.gz -C state; fi
      - name: Run the pipeline (fetch, adapt, conflate, gate, package, decide)
        id: run
        env:
          BOX: ${{ inputs.box }}
        run: |
          # The run number keeps a second run on the same day from colliding with the first's tag.
          version="$(date -u +%Y%m%d).${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # CF6: a push rebuilds from the kept answers (--no-fetch); CF4: a box sweeps only its cells.
          extra=""
          if [ "${{ github.event_name == 'push' }}" = "true" ]; then extra="--no-fetch"; fi
          if [ -n "$BOX" ]; then extra="$extra --box $BOX"; fi
          npm run -s build -- --region us --version "$version" --state state --out out --edits edits.json $extra \
            --manifest-url https://miguelaguerrero.github.io/chronicles-data/manifest.json >> "$GITHUB_OUTPUT"
      - name: Save the state for next week (only sources whose terms allow it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths="registry-us.json"
          for s in ${{ steps.run.outputs.state-sources }}; do [ -d "state/raw/$s" ] && paths="$paths raw/$s"; done
          tar -czf state-us.tar.gz -C state $paths
          gh release view state-us --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create state-us --repo "$GITHUB_REPOSITORY" --prerelease --title "Pipeline state (us)" --notes "The places pipeline's raw answers and place ID registry, restored by each weekly run. Not an archive."
          gh release upload state-us state-us.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish a release, and republish the site
        if: steps.run.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.run.outputs.version }}"
          assets=""
          for f in ${{ steps.run.outputs.files }}; do assets="$assets out/$f out/${f%.pmtiles}.blocks.json"; done
          gh release create "v$v" $assets --repo "$GITHUB_REPOSITORY" --title "US places $v" --notes "Weekly build: ${{ steps.run.outputs.reason }}."
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Nothing changed
        if: steps.run.outputs.publish != 'true'
        run: |
          echo "Not published: ${{ steps.run.outputs.reason }}"
